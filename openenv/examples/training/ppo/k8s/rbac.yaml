apiVersion: v1
kind: ServiceAccount
metadata:
  name: trainer-sa
  namespace: openenv-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trainer-role
  namespace: openenv-training
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trainer-rolebinding
  namespace: openenv-training
subjects:
  - kind: ServiceAccount
    name: trainer-sa
    namespace: openenv-training
roleRef:
  kind: Role
  name: trainer-role
  apiGroup: rbac.authorization.k8s.io
